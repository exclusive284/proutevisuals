  --accent:#ECE5D5; --accent-ink:#15120E; --leaf:#9AAE63; --clay:#D58A5C;

:root[data-theme="dark"]{

/* title border on front page cards */
var TBE=null;
function tbShadow(c,w){var o=[];for(var a=0;a<360;a+=30){var r=a*Math.PI/180;o.push((Math.cos(r)*w).toFixed(2)+'px '+(Math.sin(r)*w).toFixed(2)+'px 0 '+c)}return o.join(',')}
function applyTB(tb){
  tb=tb||TBE||STATE.tborder||{};var h=document.documentElement,st=tb.style==='outline'||tb.style==='box'?tb.style:'none';
  h.classList.toggle('tb-outline',st==='outline');h.classList.toggle('tb-box',st==='box');
  var c=tb.color||'#1A1714',w=Math.max(1,Math.min(6,+tb.size||2));
  h.style.setProperty('--tb-color',c);h.style.setProperty('--tb-size',w+'px');h.style.setProperty('--tb-shadow',tbShadow(c,w));
}
function setupTB(){
  var cur=STATE.tborder||{};TBE={style:cur.style||'none',color:cur.color||'#1A1714',size:+cur.size||2};
  var c=document.getElementById('f-tbc'),w=document.getElementById('f-tbw'),opts=document.getElementById('tbopts');
  function sync(){c.value=TBE.color.toLowerCase();w.value=TBE.size;opts.hidden=TBE.style==='none';
    document.querySelectorAll('[data-tbs]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.tbs===TBE.style))});applyTB(TBE)}
  document.querySelectorAll('[data-tbs]').forEach(function(b){b.addEventListener('click',function(){TBE.style=b.dataset.tbs;sync()})});
  c.addEventListener('input',function(){TBE.color=c.value;sync()});

}
function uploadAll(files,label){
  var ids=[],k=0;
  return new Promise(function(res,rej){
    (function next(){
      if(k>=files.length)return res(ids);
      say('Uploading '+label+(files.length>1?' '+(k+1)+' of '+files.length:'')+'…');
      assets.upload(files[k]).then(function(r){ids.push(r.id);k++;next()}).catch(function(err){
        var c=err&&err.code,n=files[k].name;
        rej(new Error(c==='too_large'?'“'+n+'” is over 20 MB. Shrink it and try again.':c==='unsupported_type'?'“'+n+'” isn’t a supported image. Use PNG, JPG, GIF or WebP.':c==='quota_or_state'?'The site’s image storage is full.':'Upload failed. Try again.'));
      });
    })();
  });
}

  var g=DR.it.cloneNode(true);g.classList.add('ghost');g.classList.remove('armed');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';document.body.appendChild(g);DR.g=g;

      });
  }

    var c=e&&e.code;
    if(c==='conflict')return;
    if(c==='not_writer'||c==='not_granted'||c==='not_declared'){admin=false;setupAdmin();route();throw new Error('This view is read-only, so changes cannot be saved here.')}
    if(c==='too_large')throw new Error('The site is too large to save.');
    if(c==='rate_limited')throw new Error('Saving too quickly. Wait a moment and try again.');
    throw new Error('Saving failed. Try again in a moment.');
  });
}
function setPreview(on,quiet){
  admin=realAdmin&&!on;
  try{if(on)sessionStorage.setItem('pv-preview','1');else sessionStorage.removeItem('pv-preview')}catch(x){}
  document.getElementById('vpill').hidden=!(realAdmin&&on);
  closeReader();if(!busy)closePanel();setupAdmin();route();if(!quiet)window.scrollTo(0,0);
}
function setupAdmin(){
  var b=document.getElementById('adminbar');
  if(!admin){b.hidden=true;b.innerHTML='';return}
  b.hidden=false;
  b.innerHTML='<span class="badge">Admin</span><button data-act="preview">View as visitor</button><button data-act="intro">Site settings</button><button data-act="words">Wording &amp; fonts</button><button data-act="colors">Colors</button><button class="primary" data-act="new">Post art</button>';
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-series],[data-open],[data-act],[data-go],[data-read],[data-turn],[data-page]');if(!t)return;
  if(t.dataset.page!=null){var k=+t.dataset.page;if(R.track){jumpTo(k)}else{var vp=byId(document.getElementById('view').dataset.id);if(vp)openReader(vp,k)}return}
  if(t.dataset.act==='grid'){if(R.track)toggleGrid();return}
  if(t.dataset.tab!=null){var tk=t.dataset.tab;if(KEYS[tk]){view.section=KEYS[tk];view.series=null}if(location.hash.slice(1)===tk)route();else location.hash=tk;return}
  if(t.dataset.series!=null){view.series=t.dataset.series||null;route();return}
  if(t.dataset.open){var p=byId(t.dataset.open);if(!p)return;if(p.pages.length){location.hash=p.id}else{openReader(p,0)}return}
  if(t.dataset.go!=null){if(!t.dataset.go)return;closeReader();location.hash=t.dataset.go;return}
  if(t.dataset.read!=null){var v=byId(document.getElementById('view').dataset.id)||R.p;if(!v)return;openReader(v,t.dataset.read==='last'?'last':0);return}
  if(t.dataset.turn){turn(+t.dataset.turn);return}
  var a=t.dataset.act;
  if(a==='edelask'&&admin&&ED){document.getElementById('edelbox').innerHTML='<span class="row" style="align-items:center;gap:8px"><span>Delete for everyone?</span><button type="button" class="danger" data-act="edel">Yes, delete</button></span>';return}
  if(a==='edel'&&admin&&ED&&!busy){busy=true;t.disabled=true;t.textContent='Deleting…';var sd=snapshot(),did=ED.id;sd.posts=sd.posts.filter(function(p){return p.id!==did});
    try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}
    save(sd).catch(function(err){busy=false;say(err.message)});return}
  if(a==='preview'&&realAdmin){setPreview(true);return}
  if(a==='unpreview'&&realAdmin){setPreview(false);return}
  if(a==='close')closeReader();
  else if(a==='new'&&admin)openPanel('post');
  else if(a==='intro'&&admin)openPanel('intro');
  else if(a==='home'&&admin)openHomeEditor();
  else if(a==='words'&&admin)openWords();
  else if(a==='colors'&&admin)openColors();
  else if(a==='addpages'&&admin)openPanel('addpages');
  else if(a==='edit'&&admin){var ep=(!document.getElementById('reader').hidden&&R.p)||byId(document.getElementById('view').dataset.id);closeReader();if(ep)openEditor(ep)}
  else if(a==='cancel'&&!busy)closePanel();
  else if(a==='askdel'){document.getElementById('admintools').innerHTML='<span>Delete this volume for everyone?</span><button class="danger" data-act="del">Yes, delete</button><button data-act="keep">Keep it</button>'}
  else if(a==='keep'){route()}
  else if(a==='del'&&!busy&&admin){
    var id=document.getElementById('view').dataset.id;busy=true;t.disabled=true;t.textContent='Deleting…';
    var s=snapshot();s.posts=s.posts.filter(function(p){return p.id!==id});
    try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}
    save(s).catch(function(err){busy=false;var d=document.getElementById('admintools');if(d)d.textContent=err.message});
  }
});
document.addEventListener('keydown',function(e){
  var r=document.getElementById('reader');if(!r||r.hidden)return;
  if(e.key==='Escape'){if(document.getElementById('rgrid'))toggleGrid();else closeReader()}
  else if(document.getElementById('rgrid'))return;
  else if(e.key==='ArrowRight'){e.preventDefault();turn(R.sg)}
  else if(e.key==='ArrowLeft'){e.preventDefault();turn(-R.sg)}
});
window.addEventListener('resize',function(){if(R.track)setPos(R.i)});
window.addEventListener('hashchange',function(){closeReader();route();window.scrollTo(0,0)});

document.addEventListener('submit',function(e){
  e.preventDefault();if(busy||!admin)return;
  var f=e.target,btn=f.querySelector('button[type=submit]');
  function fail(err){busy=false;if(btn)btn.disabled=false;say(err.message)}
  if(f.id==='introform'){
    busy=true;btn.disabled=true;
    var mf=document.getElementById('f-mascot').files[0],rm=document.getElementById('f-nomascot');
    var lf=document.getElementById('f-logo').files[0],rl=document.getElementById('f-nologo');
    var bf=document.getElementById('f-banner').files[0],rb=document.getElementById('f-nobanner');
    var s=snapshot();s.intro=document.getElementById('f-intro').value.trim();
    s.name=document.getElementById('f-name').value.trim()||'Proute Visuals';
    if(TBE)s.tborder={style:TBE.style,color:TBE.color,size:TBE.size};
    s.mark=document.getElementById('f-mark').value.trim();
    if(BP)s.bannerPos={x:BP.x,y:BP.y,z:BP.z};
    if(rm&&rm.checked)s.mascot='';
    if(rl&&rl.checked)s.logo='';
    if(rb&&rb.checked)s.banner='';
    (mf?uploadAll([mf],'mascot'):Promise.resolve(null)).then(function(ids){if(ids)s.mascot=ids[0];
      return lf?uploadAll([lf],'logo'):null}).then(function(ids){if(ids)s.logo=ids[0];
      return bf?uploadAll([bf],'channel art'):null}).then(function(ids){if(ids)s.banner=ids[0];
      say('Saving…');return save(s)}).catch(fail);
    return;
  }
  if(f.id==='editform'){saveEditor(btn);return}
  if(f.id==='homeform'){saveHome(btn);return}
  if(f.id==='colorform'){var s3=snapshot();s3.colors=CE?{bg:CE.bg,surface:CE.surface}:{};busy=true;btn.disabled=true;say('Saving…');save(s3).catch(fail);return}
  if(f.id==='wordform'){
    var s2=snapshot();s2.text={};s2.fonts={};
    f.querySelectorAll('[data-tk]').forEach(function(i){var v=i.value.trim();if(v&&v!==TDEF[i.dataset.tk])s2.text[i.dataset.tk]=v});
    ['hud','head','body'].forEach(function(k){var v=fontVal(k);if(v)s2.fonts[k]=v});
    busy=true;btn.disabled=true;say('Saving…');save(s2).catch(fail);return;
  }
  if(f.id==='addform'){
    var more=sortFiles(document.getElementById('f-more').files);
    if(!more.length){say('Pick at least one page.');return}
    var vid=document.getElementById('view').dataset.id;
    busy=true;btn.disabled=true;
    uploadAll(more,'page').then(function(ids){
      var s=snapshot();s.posts=s.posts.map(function(p){return p.id===vid?Object.assign({},p,{pages:p.pages.concat(ids)}):p});
      say('Publishing…');return save(s);
    }).catch(fail);
    return;
  }
  if(f.id!=='postform')return;
  var single=f.dataset.type!=='comic';
  var cover=document.getElementById(single?'f-image':'f-cover').files[0];
  var pages=single?[]:sortFiles(document.getElementById('f-pages').files);
  var title=document.getElementById('f-title').value.trim();
  if(!cover){say(single?'Add an image.':'Add a cover image.');return}
  if(!single&&!pages.length){say('Add at least one page, or switch to Single image.');return}
  if(!title){say('Add a title.');return}
  busy=true;btn.disabled=true;
  var post={dir:!single&&document.getElementById('f-dir').value==='rtl'?'rtl':'ltr',id:'p'+Date.now().toString(36),title:title,section:document.getElementById('f-section').value,series:document.getElementById('f-series').value.trim(),desc:document.getElementById('f-desc').value.trim(),date:new Date().toISOString()};
  dims(cover).then(function(d){if(d){post.w=d.w;post.h=d.h}return uploadAll([cover],single?'image':'cover')})
  .then(function(ids){post.cover=ids[0];return pages.length?uploadAll(pages,'page'):[]})
  .then(function(ids){post.pages=ids;var s=snapshot();s.posts=[post].concat(s.posts);say('Publishing…');
    try{history.replaceState(null,'',location.pathname+location.search+(ids.length?'#'+post.id:''))}catch(x){}
    return save(s)})
  .catch(fail);
});

shell();route();
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('user'),window.claude.use('artifact'),window.claude.use('assets')]).then(function(r){
    art=r[1];assets=r[2];
    return (r[0]?r[0].canEdit():Promise.resolve(false)).then(function(ok){
      realAdmin=!!(ok&&art&&assets);var pv=false;try{pv=sessionStorage.getItem('pv-preview')==='1'}catch(x){}
      setPreview(pv,true);
    });
  }).catch(function(){});
}
})();
</script>
</body></html>
